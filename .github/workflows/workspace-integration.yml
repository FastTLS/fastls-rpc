name: Workspace integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-integration.yml'
      - 'go.mod'
      - 'go.sum'
      - 'grpc/**'
      - 'jsonrpc/**'
      - 'internal/**'
      - 'integration/workspace/**'
      - 'integration/policy/**'
      - '.github/workflows/address-policy-integration.yml'
  pull_request:
    paths:
      - '.github/workflows/workspace-integration.yml'
      - 'go.mod'
      - 'go.sum'
      - 'grpc/**'
      - 'jsonrpc/**'
      - 'internal/**'
      - 'integration/workspace/**'
      - 'integration/policy/**'
      - '.github/workflows/address-policy-integration.yml'
  workflow_dispatch:
    inputs:
      development_policy:
        description: Also verify the reviewed development core policy matrix (Fetch/MITM inputs must be full commit SHAs)
        required: false
        default: false
        type: boolean
      fetch_ref:
        description: fastls-fetch branch, tag or commit
        required: true
        default: main
        type: string
      mitm_ref:
        description: fastls-mitm branch, tag or commit
        required: true
        default: main
        type: string

concurrency:
  group: workspace-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: 'off'
  FETCH_REF: ${{ inputs.fetch_ref || 'cfafeee1f804b5697cb5d6df9762359ede7d180a' }}
  MITM_REF: ${{ inputs.mitm_ref || '1a6fb2869160288cd81b1d800dfef5cb37b385dc' }}

jobs:
  development-policy:
    if: github.event_name == 'workflow_dispatch' && inputs.development_policy
    uses: ./.github/workflows/address-policy-integration.yml
    with:
      core_ref: 32699153caa15a9bbbe11e178465a315d3b59861
      transport_ref: d5afcd1a2db48a40850363b76e8a19eb339c757c
      imitate_ref: fd10ea4393408e904ae2866ecbfe3efaaaa6ad8e
      fetch_ref: ${{ inputs.fetch_ref }}
      mitm_ref: ${{ inputs.mitm_ref }}
  four-process-contract:
    name: Fetch, JSON-RPC and gRPC through MITM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out fastls-rpc
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: workspace/fastls-rpc-ftransport
          persist-credentials: false
      - name: Check out fastls-fetch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FastTLS/fastls-fetch
          ref: ${{ env.FETCH_REF }}
          path: workspace/fastls-fetch-ftransport
          persist-credentials: false
      - name: Check out fastls-mitm
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: FastTLS/fastls-mitm
          ref: ${{ env.MITM_REF }}
          path: workspace/fastls-mitm-ftransport
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: |
            workspace/fastls-fetch-ftransport/go.sum
            workspace/fastls-rpc-ftransport/go.sum
            workspace/fastls-mitm-ftransport/go.sum
      - name: Record exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace-evidence
          {
            printf 'go=%s\n' "$(go version)"
            printf 'fastls-fetch=%s\n' "$(git -C workspace/fastls-fetch-ftransport rev-parse HEAD)"
            printf 'fastls-rpc=%s\n' "$(git -C workspace/fastls-rpc-ftransport rev-parse HEAD)"
            printf 'fastls-mitm=%s\n' "$(git -C workspace/fastls-mitm-ftransport rev-parse HEAD)"
          } | tee workspace-evidence/revisions.txt
          for module in fastls-fetch-ftransport fastls-rpc-ftransport fastls-mitm-ftransport; do
            (cd "workspace/${module}" && go mod edit -json) \
              > "workspace-evidence/${module}-go-mod.json"
          done
      - name: Verify standalone modules
        shell: bash
        run: |
          set -euo pipefail
          for module in fastls-fetch-ftransport fastls-rpc-ftransport fastls-mitm-ftransport; do
            (cd "workspace/${module}" && go mod verify)
          done
      - name: Run four-process contract
        shell: bash
        working-directory: workspace/fastls-rpc-ftransport
        run: |
          set -euo pipefail
          go test -count=3 -tags workspace_e2e ./integration/workspace 2>&1 \
            | tee ../../workspace-evidence/workspace-e2e.log
      - name: Upload workspace evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workspace-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace-evidence/
          retention-days: 14
          if-no-files-found: error

  formal-policy:
    if: ${{ !inputs.development_policy }}
    name: Formal policy / ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        go: ['1.26.10', '1.27.3']
    env:
      FASTLS_POLICY_GRAPH: formal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workspace/fastls-rpc-ftransport
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: FastTLS/fastls-fetch
          ref: ${{ env.FETCH_REF }}
          path: workspace/fastls-fetch-ftransport
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: FastTLS/fastls-mitm
          ref: ${{ env.MITM_REF }}
          path: workspace/fastls-mitm-ftransport
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            workspace/fastls-fetch-ftransport/go.sum
            workspace/fastls-rpc-ftransport/go.sum
            workspace/fastls-mitm-ftransport/go.sum
      - name: Record source and verify formal policy plus legacy refusal
        working-directory: workspace/fastls-rpc-ftransport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../formal-policy-evidence
          for module in fastls-fetch-ftransport fastls-rpc-ftransport fastls-mitm-ftransport; do
            git -C "../${module}" rev-parse HEAD >> ../../formal-policy-evidence/sources.txt
            (cd "../${module}" && go mod verify)
          done
          go test -v -count=3 -tags policy_e2e -timeout 480s ./integration/policy 2>&1 \
            | tee ../../formal-policy-evidence/policy.log
      - name: Retain original policy evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: formal-policy-${{ matrix.os }}-go${{ matrix.go }}
          path: formal-policy-evidence/
          retention-days: 14
