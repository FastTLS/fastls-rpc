name: Installed service releases

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact service release tag
        required: true
        default: v0.3.0
        type: string
      fetch_ref:
        description: Full released Fetch source SHA
        required: true
        type: string
      mitm_ref:
        description: Full released MITM source SHA
        required: true
        type: string
      rpc_ref:
        description: Full released RPC source SHA (may differ from smoke tooling)
        required: true
        type: string
      rpc_version:
        description: Exact RPC release tag when different from Fetch
        type: string
        default: v0.3.1
      mitm_version:
        description: Unchanged pinned MITM release version
        type: string
        default: v0.1.2
      resource_check:
        description: Run five-minute resources only for changed resource mechanisms or explicit acceptance
        type: boolean
        default: false
      primary_only:
        description: Tool-only validation of unchanged releases on Linux and Windows
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

jobs:
  installed:
    name: Installed / ${{ matrix.target }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.primary_only && '{"include":[{"runner":"ubuntu-24.04","target":"linux-amd64"},{"runner":"windows-2022","target":"windows-amd64"}]}' || '{"include":[{"runner":"ubuntu-24.04","target":"linux-amd64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"windows-2022","target":"windows-amd64"},{"runner":"windows-11-arm","target":"windows-arm64"},{"runner":"macos-15-intel","target":"darwin-amd64"},{"runner":"macos-15","target":"darwin-arm64"}]}') }}
    runs-on: ${{ matrix.runner }}
    env:
      GOWORK: 'off'
      FASTLS_POLICY_GRAPH: formal
      RELEASE_VERSION: ${{ inputs.release_version }}
      MITM_RELEASE_VERSION: ${{ inputs.mitm_version }}
      RPC_RELEASE_VERSION: ${{ inputs.rpc_version || inputs.release_version }}
      RELEASE_TARGET: ${{ matrix.target }}
      FETCH_SHA: ${{ inputs.fetch_ref }}
      RPC_SHA: ${{ inputs.rpc_ref }}
      MITM_SHA: ${{ inputs.mitm_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workspace/fastls-rpc
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: FastTLS/fastls-fetch
          ref: ${{ inputs.fetch_ref }}
          path: workspace/fastls-fetch
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: FastTLS/fastls-mitm
          ref: ${{ inputs.mitm_ref }}
          path: workspace/fastls-mitm
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: workspace/fastls-rpc/go.sum
      - name: Verify official archive, signed source and executable identities
        working-directory: workspace/fastls-rpc
        run: python scripts/verify_service_releases.py
      - name: Exercise downloaded Fetch, JSON-RPC, gRPC and MITM executables
        working-directory: workspace/fastls-rpc
        shell: bash
        run: |
          set -euo pipefail
          go test -v -count=1 -tags policy_e2e -run '^(TestServiceAddressPolicyAcrossEntries|TestMITMGatewayEnforcesPolicyForThreeRequestServices|TestMITMServiceUnspecifiedTargetsNeverDial|TestServiceExplicitH3AcrossEntries|TestServiceCooperativeShutdownAcrossEntries)$' -timeout 240s ./integration/policy 2>&1 | tee "${RELEASE_EVIDENCE}/installed-policy.log"
      - name: Five-minute mixed-protocol lifecycle resource and recovery check
        if: inputs.resource_check && matrix.target == 'linux-amd64'
        working-directory: workspace/fastls-rpc
        env:
          FASTLS_LIFECYCLE_RESOURCE_SECONDS: '300'
        shell: bash
        run: |
          set -euo pipefail
          go test -v -count=1 -tags policy_e2e -run '^TestServiceLifecycleResourceRecovery$' -timeout 420s ./integration/policy 2>&1 | tee "${RELEASE_EVIDENCE}/lifecycle-resource.log"
      - name: Stage compact verification evidence
        if: always()
        shell: bash
        run: python workspace/fastls-rpc/scripts/evidence_archive.py "${RUNNER_TEMP}/service-release-evidence" "${RUNNER_TEMP}/service-release-compact"
      - name: Preserve installed artifact evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: installed-services-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-release-compact/
          retention-days: 14
          if-no-files-found: warn
